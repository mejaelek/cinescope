<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Your personal CineScope watchlist — films you want to watch." />
    <title>My Watchlist | CineScope</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display:ital@0;1&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

    <header class="site-header" id="site-header">
        <div class="header-inner">
            <a href="index.html" class="logo" aria-label="CineScope Home">
                <span class="logo-icon">◉</span>
                <span class="logo-text">CineScope</span>
            </a>

            <div class="header-actions">
                <nav class="main-nav" id="main-nav" aria-label="Main navigation">
                    <a href="index.html" class="nav-link" data-page="home">Discover</a>
                    <a href="watchlist.html" class="nav-link active" data-page="watchlist">Watchlist <span class="badge"
                            id="nav-badge">0</span></a>
                    <a href="search.html" class="nav-link" data-page="search">Search</a>
                </nav>

                <button type="button" id="google-login-btn" class="nav-btn-google" aria-label="Sign in with Google Drive">
                    <svg class="google-drive-icon" viewBox="0 0 87.3 78" width="18" height="16" aria-hidden="true" focusable="false">
                        <path d="m6.6 66.85 3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8h-27.5c0 1.55.4 3.1 1.2 4.5z" fill="#0066da"/>
                        <path d="m43.65 25-13.75-23.8c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44a9.06 9.06 0 0 0 -1.2 4.5h27.5z" fill="#00ac47"/>
                        <path d="m73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5h-27.502l5.852 11.5z" fill="#ea4335"/>
                        <path d="m43.65 25 13.75-23.8c-1.35-.8-2.9-1.2-4.5-1.2h-18.5c-1.6 0-3.15.45-4.5 1.2z" fill="#00832d"/>
                        <path d="m59.8 53h-32.3l-13.75 23.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z" fill="#2684fc"/>
                        <path d="m73.4 26.5-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3l-13.75 23.8 16.15 28h27.45c0-1.55-.4-3.1-1.2-4.5z" fill="#ffba00"/>
                    </svg>
                    <span id="google-login-text">Sign In with Google</span>
                </button>

                <button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </header>

    <main class="main-content watchlist-main">
        <div class="container">
            <div class="page-header">
                <h1 class="page-title">My <em>Watchlist</em></h1>
                <p class="page-subtitle" id="watchlist-count">0 films saved</p>
                <div class="watchlist-controls">
                    <button class="btn btn-outline btn-sm" id="clear-watchlist-btn">Clear All</button>
                    <select class="sort-select" id="watchlist-sort" aria-label="Sort watchlist">
                        <option value="added">Recently Added</option>
                        <option value="title">Title A–Z</option>
                        <option value="rating">Rating</option>
                    </select>
                </div>
            </div>

            <!-- Stats Bar -->
            <div class="stats-bar" id="stats-bar">
                <div class="stat-item">
                    <span class="stat-value" id="stat-total">0</span>
                    <span class="stat-label">Films</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="stat-avg">—</span>
                    <span class="stat-label">Avg Rating</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="stat-top-genre">—</span>
                    <span class="stat-label">Top Genre</span>
                </div>
            </div>

            <!-- Watchlist Grid -->
            <div class="movie-grid" id="watchlist-grid" aria-live="polite" aria-label="Watchlist films">
                <!-- Injected by JS -->
            </div>

            <!-- Empty State -->
            <div class="empty-state" id="empty-state" hidden>
                <div class="empty-icon">🎞️</div>
                <h2>Your watchlist is empty</h2>
                <p>Start discovering films on the home page and add them here.</p>
                <a href="index.html" class="btn btn-primary">Discover Films</a>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
        <div class="modal" id="modal">
            <button class="modal-close" id="modal-close" aria-label="Close modal">✕</button>
            <div class="modal-content" id="modal-content"></div>
        </div>
    </div>

    <div class="toast" id="toast" role="alert" aria-live="assertive"></div>

    <footer class="site-footer">
        <div class="container footer-inner">
            <div class="footer-brand">
                <span class="logo-icon">◉</span>
                <span class="logo-text">CineScope</span>
            </div>
            <p class="footer-copy">Data powered by <a href="https://www.themoviedb.org" target="_blank"
                    rel="noopener">TMDB</a> &amp; <a href="https://www.omdbapi.com" target="_blank"
                    rel="noopener">OMDb</a>. Built by <strong>Kamohelo Godfrey Mejaele</strong> — CSE 499</p>
        </div>
    </footer>

    <script type="module" src="js/watchlist.js?v=4"></script>
</body>

</html>
